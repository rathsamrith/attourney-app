# Attest — full local stack. One command brings up everything:
#
#   docker compose up -d --build
#
# Then open http://localhost:5173 and sign in with any dev user below
# (all passwords are "attest"):
#   sokha.prum (record officer) · ruth.okafor (presiding) · wei.chen / h.albrecht
#   (panelists) · maya.lindqvist (plaintiff counsel) · daniel.osei (defense counsel)
#   · jordan.reyes (witness) · dara.kim (court reporter)
#
# API: http://localhost:3000/api  ·  API docs: http://localhost:3000/api/docs
# Keycloak admin: http://localhost:8080  (admin / admin)
#
# NOTE: The token issuer is http://localhost:8080 (what the browser uses). The backend
# validates that issuer but fetches Keycloak's signing keys over the internal network
# at http://keycloak:8080 (OIDC_JWKS_URI), so no host.docker.internal / hosts-file
# trickery is needed. Not for production.
name: attest

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: attest
      POSTGRES_PASSWORD: attest
      POSTGRES_DB: attest
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attest"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # OIDC provider. Imports infra/keycloak/attest-realm.json on first start.
  # Dev users all have password "attest"; MFA and smart-card login are configured per environment.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The browser reaches Keycloak here, so this is the token issuer.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports: ["8080:8080"]
    volumes: ["./infra/keycloak:/opt/keycloak/data/import:ro"]

  # SFU for hearing and caucus video. Dev mode; keys match the backend below.
  # Media never passes through the API, and no recording is configured.
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    environment:
      LIVEKIT_KEYS: "devkey: attest-dev-livekit-secret-change-me-0000"
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]

  # NestJS API. Applies migrations and seeds (once) on startup, then serves :3000.
  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://attest:attest@postgres:5432/attest?schema=public"
      REDIS_URL: "redis://redis:6379"
      # Issuer is browser-facing (localhost); keys are fetched over the internal network.
      OIDC_ISSUER: "http://localhost:8080/realms/attest"
      OIDC_JWKS_URI: "http://keycloak:8080/realms/attest/protocol/openid-connect/certs"
      OIDC_AUDIENCE: "attest-api"
      WEB_ORIGIN: "http://localhost:5173"
      PORT: "3000"
      VOTE_ENCRYPTION_KEY: "c8cd8bc52358b5a3cf688a77c048e52575de5d62e0fdd9552e5e0b6cf51a8bd0"
      STORAGE_DIR: "/app/storage"
      ERRATA_WINDOW_DAYS: "30"
      # The browser connects to LiveKit directly, so this stays host-facing.
      LIVEKIT_URL: "ws://localhost:7880"
      LIVEKIT_API_KEY: "devkey"
      LIVEKIT_API_SECRET: "attest-dev-livekit-secret-change-me-0000"
    volumes:
      - storage:/app/storage
    ports: ["3000:3000"]

  # React SPA built to static files, served by nginx with /api and /socket.io
  # proxied to the backend. Published on host port 5173 (the realm's redirect URI).
  frontend:
    build:
      context: ./frontend
      args:
        VITE_OIDC_AUTHORITY: "http://localhost:8080/realms/attest"
        VITE_OIDC_CLIENT_ID: "attest-web"
    depends_on:
      backend:
        condition: service_started
    ports: ["5173:80"]

volumes:
  pgdata:
  storage:
